[project]
name = "python-tutorial"
version = "0.6.0"
requires-python = "==3.11.*"
dependencies = [
    "notebook==6.5.7",
    "rise==5.7.1",
    "traitlets==5.9.0",
    "ipykernel>=6,<7",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "basemap>=2.0.0",
    "cartopy>=0.26.0",
    "pooch>=1.9.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
